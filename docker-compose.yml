services:
  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: soc_user
      MONGO_INITDB_ROOT_PASSWORD: secure_password
      MONGO_INITDB_DB: soc_platform
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - soc-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - soc-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      MONGODB_URI: mongodb://soc_user:secure_password@mongodb:27017/soc_platform?authSource=admin
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      API_PORT: 5000
      API_HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: change_me_in_production
      JWT_REFRESH_SECRET: change_me_refresh_in_production
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    networks:
      - soc-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - soc-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - soc-network

volumes:
  mongodb_data:
  redis_data:

networks:
  soc-network:
    driver: bridge
